server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Public gateway surface (matches live https://pont.xaigrok.ir/v1 → pont-api /api/v1).
  location ~ ^/v1/(models|chat/completions|responses|messages)(/count_tokens)?$ {
    proxy_pass http://api:9880/api/v1/$1$2;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api:9880;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Gateway + health routes live at the API root, so the Endpoints page can call them same-origin.
  location ~ ^/(openrouter|opencode-go|zen|health)(/|$) {
    proxy_pass http://api:9880;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
